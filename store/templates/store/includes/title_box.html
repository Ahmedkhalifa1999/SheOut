{# Page banner: expects `title` and optional `parent_url`/`parent_label`. #}
<div class="all-title-box">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <h2>{{ title }}</h2>
                <ul class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'store:index' %}">Home</a></li>
                    {% if parent_url %}<li class="breadcrumb-item"><a href="{{ parent_url }}">{{ parent_label }}</a></li>{% endif %}
                    <li class="breadcrumb-item active">{{ title }}</li>
                </ul>
            </div>
        </div>
    </div>
</div>
